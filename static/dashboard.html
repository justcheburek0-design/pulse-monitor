<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Monitor — Статус</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:16px}
.header{text-align:center;padding:20px 0 24px}
.header h1{font-size:24px;font-weight:700;color:#fff}
.header .subtitle{color:#94a3b8;font-size:14px;margin-top:4px}
.status-grid{display:grid;gap:12px;max-width:600px;margin:0 auto}
.card{background:#1e293b;border-radius:12px;padding:16px;border:1px solid #334155}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-title{font-size:16px;font-weight:600}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-up{background:#064e3b;color:#34d399}
.badge-down{background:#7f1d1d;color:#f87171}
.badge-warn{background:#713f12;color:#fbbf24}
.card-url{font-size:12px;color:#64748b;word-break:break-all;margin-top:4px}
.card-stats{display:flex;gap:16px;margin-top:8px;font-size:13px;color:#94a3b8}
.card-stats span{color:#e2e8f0;font-weight:500}
.refresh-btn{display:block;width:100%;max-width:600px;margin:20px auto 0;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
.refresh-btn:active{background:#2563eb}
.error-msg{text-align:center;padding:40px;color:#f87171;font-size:14px}
</style>
</head>
<body>
<div class="header">
<h1>⚡ Pulse Monitor</h1>
<div class="subtitle" id="last-update">Загрузка...</div>
</div>
<div class="status-grid" id="status-grid">
<div class="error-msg">Подключение к Pulse API...</div>
</div>
<button class="refresh-btn" onclick="loadStatus()">🔄 Обновить</button>

<script>
const API_BASE = window.location.origin;

async function loadStatus() {
  const grid = document.getElementById('status-grid');
  const lastUpdate = document.getElementById('last-update');
  
  try {
    const resp = await fetch(`${API_BASE}/api/v1/monitors`);
    if (!resp.ok) throw new Error(`API: ${resp.status}`);
    const monitors = await resp.json();
    
    if (!monitors || monitors.length === 0) {
      grid.innerHTML = '<div class="error-msg">Нет мониторов. Добавьте через API.</div>';
      return;
    }
    
    grid.innerHTML = '';
    for (const m of monitors) {
      const badgeClass = m.status === 'up' ? 'badge-up' : m.status === 'down' ? 'badge-down' : 'badge-warn';
      const badgeText = m.status === 'up' ? 'UP' : m.status === 'down' ? 'DOWN' : 'WARN';
      const uptime = m.uptime_percent !== undefined ? m.uptime_percent.toFixed(1) : '—';
      const respTime = m.avg_response_ms !== undefined ? `${m.avg_response_ms.toFixed(0)}ms` : '—';
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-title">${escapeHtml(m.name)}</span>
          <span class="badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="card-url">${escapeHtml(m.url)}</div>
        <div class="card-stats">
          <div>Uptime: <span>${uptime}%</span></div>
          <div>Response: <span>${respTime}</span></div>
          <div>Checks: <span>${m.total_checks || 0}</span></div>
        </div>
      `;
      grid.appendChild(card);
    }
    
    lastUpdate.textContent = `Обновлено: ${new Date().toLocaleTimeString('ru-RU')}`;
  } catch (e) {
    // API может требовать auth — покажем упрощённый статус
    grid.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">Mission Control (Kanban)</span>
          <span class="badge badge-warn">CHECK</span>
        </div>
        <div class="card-url">https://db.m-br.ru:445</div>
        <div class="card-stats"><div>Порт: <span>443</span></div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">GitHub API</span>
          <span class="badge badge-warn">CHECK</span>
        </div>
        <div class="card-url">https://api.github.com</div>
        <div class="card-stats"><div>Порт: <span>443</span></div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Caddy (Web Server)</span>
          <span class="badge badge-warn">CHECK</span>
        </div>
        <div class="card-url">localhost:80 / localhost:443</div>
        <div class="card-stats"><div>Reverse Proxy</span></div></div>
      </div>
    `;
    lastUpdate.textContent = `API недоступен: ${e.message}`;
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadStatus();
setInterval(loadStatus, 30000);
</script>
</body>
</html>
