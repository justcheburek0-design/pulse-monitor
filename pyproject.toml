[tool.poetry]
name = "pulse-monitor"
version = "1.0.0"
description = "Production-ready monitoring and alerting platform"
authors = ["Pulse Team <team@pulse.local>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.30.0"
aiosqlite = "^0.20.0"
httpx = "^0.28.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.18"
alembic = "^1.14.0"
typer = {extras = ["all"], version = "^0.15.0"}
rich = "^13.9.0"
apscheduler = "^3.11.0"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
aiosmtplib = "^3.0.0"

[tool.poetry.scripts]
pulse-cli = "src.cli.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ── pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ── coverage ────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["src/cli/*", "src/gen_*.py", "src/workers/gen_*.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
